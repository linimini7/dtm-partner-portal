app = "dtm-partner-portal"
primary_region = "fra"

[build]

[env]
PORT = "3000"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[checks.health]
port = 3000
type = "http"
interval = "30s"
timeout = "10s"
grace_period = "20s"
path = "/healthz"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
